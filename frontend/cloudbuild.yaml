steps:
  # Ensure Secret Manager secret exists (create if missing)
  - name: gcr.io/google.com/cloudsdk/gcloud
    id: Ensure GEMINI_API_KEY secret
    entrypoint: bash
    args:
      - -c
      - |
        gcloud secrets describe GEMINI_API_KEY || gcloud secrets create GEMINI_API_KEY --replication-policy=automatic

  # Optionally add/rotate secret version from trigger substitution
  - name: gcr.io/google.com/cloudsdk/gcloud
    id: Rotate GEMINI_API_KEY version (from trigger)
    entrypoint: bash
    args:
      - -c
      - |
        if [ -n "${_GEMINI_API_KEY}" ]; then echo -n "${_GEMINI_API_KEY}" | gcloud secrets versions add GEMINI_API_KEY --data-file=-; fi
  # Build and push the container image for Cloud Run
  - name: gcr.io/cloud-builders/docker
    id: Build image
    args: ["build", "-t", "gcr.io/$PROJECT_ID/orbit-api:latest", "."]

  - name: gcr.io/cloud-builders/docker
    id: Push image
    args: ["push", "gcr.io/$PROJECT_ID/orbit-api:latest"]

  # Deploy to Cloud Run (fully managed)
  - name: gcr.io/google.com/cloudsdk/gcloud
    id: Deploy Cloud Run service
    args:
      [
        "run", "deploy", "orbit-api",
        "--image", "gcr.io/$PROJECT_ID/orbit-api:latest",
        "--region", "europe-west9",
        "--platform", "managed",
        "--allow-unauthenticated",
        "--port", "8080",
        "--min-instances", "1",
        "--max-instances", "20",
        "--concurrency", "80",
        "--cpu", "1",
        "--memory", "512Mi",
        # Use a user-defined substitution for GEMINI_API_KEY on the trigger (e.g., _GEMINI_API_KEY)
        "--update-env-vars",
        "LOG_LEVEL=info,CORS_ORIGINS=https://orbit-defi.netlify.app,GEMINI_MODEL=gemini-3-pro-preview,RESEARCH_ENABLED=true,RESEARCH_PROVIDER=coingecko",
        "--set-secrets",
        "GEMINI_API_KEY=projects/$PROJECT_ID/secrets/GEMINI_API_KEY:latest"
      ]

  # Grant Secret Manager access to the Cloud Run default service account
  - name: gcr.io/google.com/cloudsdk/gcloud
    id: Grant secret accessor to Cloud Run SA
    entrypoint: bash
    args:
      - -c
      - |
        PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='get(projectNumber)')
        gcloud projects add-iam-policy-binding $PROJECT_ID \
          --member=serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com \
          --role=roles/secretmanager.secretAccessor

images:
  - "gcr.io/$PROJECT_ID/orbit-api:latest"

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY