steps:
  # Build image (already working ✅)
  - name: 'gcr.io/cloud-builders/docker'
    id: Build image
    dir: 'frontend'
    args: ["build", "-t", "europe-west9-docker.pkg.dev/$PROJECT_ID/orbit-defi/orbit-api:latest", "."]

  # Push image (already working ✅)
  - name: 'gcr.io/cloud-builders/docker'
    id: Push image
    args: ["push", "europe-west9-docker.pkg.dev/$PROJECT_ID/orbit-defi/orbit-api:latest"]

  # Deploy to Cloud Run - FIX THIS STEP ✅
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy Cloud Run service
    entrypoint: gcloud  # ← ADD THIS LINE
    args:
      - run
      - deploy
      - orbit-api
      - --image=europe-west9-docker.pkg.dev/$PROJECT_ID/orbit-defi/orbit-api:latest
      - --region=europe-west9
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=5
      - --concurrency=80
      - --memory=256Mi
      - --update-env-vars=LOG_LEVEL=info,CORS_ORIGINS=https://orbit-defi.netlify.app,GEMINI_MODEL=gemini-3-pro-preview,RESEARCH_ENABLED=true,RESEARCH_PROVIDER=coingecko
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest
images:
  - "europe-west9-docker.pkg.dev/$PROJECT_ID/orbit-defi/orbit-api:latest"

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
